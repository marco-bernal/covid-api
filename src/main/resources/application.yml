spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/covid
    driverClassName: org.postgresql.Driver
    username: postgres
    password: postgres
    jpa:
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          jdbc:
            lob:
              non_contextual_creation: true
    flyway:
      enabled: true
      locations: [ 'classpath:db/migration', 'classpath:db/data' ]